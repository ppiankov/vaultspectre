apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-kafka-secrets
  namespace: docflow
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-secrets
  data:
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: secret/docflow/prod/kafka
        property: password
    - secretKey: KAFKA_USERNAME
      remoteRef:
        key: secret/docflow/prod/kafka
        property: username
  dataFrom:
    - extract:
        key: secret/docflow/prod/kafka-tls
