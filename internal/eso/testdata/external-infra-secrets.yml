apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-infra-secrets
  namespace: docflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  data:
    - secretKey: INFRA_TOKEN
      remoteRef:
        key: secret/docflow/prod/infra
        property: token
    - secretKey: INFRA_API_KEY
      remoteRef:
        key: secret/docflow/prod/infra
        property: api_key
