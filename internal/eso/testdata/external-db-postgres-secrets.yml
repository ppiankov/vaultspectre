apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-db-postgres-secrets
  namespace: docflow
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-postgres-secrets
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: secret/docflow/prod/postgres
        property: password
    - secretKey: DB_USER
      remoteRef:
        key: secret/docflow/prod/postgres
        property: username
    - secretKey: DB_HOST
      remoteRef:
        key: secret/docflow/prod/postgres
        property: host
